kind = "web"
previewPath = "/"
title = "Automation Hub"
description = "A secure, responsive web hub for teams to organize mini automation apps into categories. Admins manage categories and app links; users browse and open them."
version = "1.0.0"
id = "artifacts/automation-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24124

[services.development]
run = "pnpm --filter @workspace/automation-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/automation-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/automation-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24124"
BASE_PATH = "/"
