<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          function isViteOrWs(msg) {
            var str = String(msg || '').toLowerCase();
            return str.indexOf('websocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1 || str.indexOf('@vite/client') !== -1;
          }
          window.addEventListener('error', function(e) {
            if (isViteOrWs(e.message) || isViteOrWs(e.filename) || (e.error && isViteOrWs(e.error.message))) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }, true);
          window.addEventListener('unhandledrejection', function(e) {
            var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
            if (isViteOrWs(reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
    <title>Automation Hub</title>
    <meta name="description" content="Automation Hub — An authenticated hub for organizing and launching team automation apps by category." />

  </head>

  </body>
</html>
